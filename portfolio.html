<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeon Labs</title>
<meta name="description" content="Yeon Labs">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" type="image/jpeg" href="src/logo.jpg">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:#ffffff; display:flex; flex-direction:column;
  }
  a{ color:inherit; text-decoration:none; }
  a:focus-visible{ outline:2px solid #005cff; outline-offset:3px; }

  /* header */
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:3.9vw;
  }
  .mark{ display:block; height:11vw; }
  .mark img{ height:100%; width:auto; display:block; opacity:0.5; }
  .top nav{ display:flex; gap:6vw; font-size:2.7vw; font-weight:500; }

  /* body: 3/4 photo + 1/4 logo */
  .body{
    flex:1; display:flex; min-height:0;
    padding:0 3.9vw;
  }

  /* left: 4-col split photos */
  .split{ flex:3; display:flex; gap:2px; }
  .split .col{ flex:1 1 0; overflow:hidden; background:#858c8f; }
  .split img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:grayscale(100%);
    transition:filter 0.4s ease;
  }
  .split .col:hover img,
  .split .col:focus-within img{ filter:grayscale(0); }
  @media (prefers-reduced-motion:reduce){ .split img{ transition:none; } }

  /* right: SVG logo */
  .logo-section{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .logo-section .logomark{ width:min(100%, 340px); height:auto; }

  /* footer */
  footer{
    padding:0 3.9vw 3.9vw;
  }
  footer p{
    font-size:2.7vw; font-weight:500; line-height:1; letter-spacing:-.01em;
    text-align:center;
  }

  @media screen and (min-width:769px){
    .top{ padding:min(1.875vw,36px) min(2.08vw,40px); }
    .mark{ height:min(3.4vw,66px); }
    .top nav{ gap:min(3.6vw,70px); font-size:min(1.04vw,20px); }
    .body{ padding:0 min(2.08vw,40px); }
    .logo-section .logomark{ width:min(21.2vw,407px); margin-bottom:min(67px,10%); }
    footer{ padding:min(1.14vw,10px) min(2.08vw,40px) min(2.08vw,38px); }
    footer p{ text-align:right; font-size:min(.94vw,18px); }
  }
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="#"><img src="src/logo.jpg" alt="Yeon Labs"></a>
  <nav aria-label="sections">
    <button id="menu-btn" aria-label="Menu">&#9776;</button>
  </nav>
</header>

<div class="body">
  <div class="split" id="split">
    <div class="col"><img src="" alt=""></div>
    <div class="col"><img src="" alt=""></div>
    <div class="col"><img src="" alt=""></div>
    <div class="col"><img src="" alt=""></div>
  </div>
  <div class="logo-section">
    <svg class="logomark" viewBox="0 0 320 170" role="img" aria-label="Yeon Labs">
      <text x="160" y="98" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="62" font-weight="700" letter-spacing="-1" fill="#000">yeon<tspan fill="#858c8f">/</tspan>labs</text>
    </svg>
  </div>
</div>

<footer>
  <p>&copy; 2026 YEON LABS. All Rights Reserved.</p>
</footer>

<script>
  (function(){ var s=["src/1.jpg", "src/2.jpg", "src/3.jpg", "src/4.jpg", "src/5.jpg", 
  "src/6.jpg", "src/7.jpg", "src/8.jpg","src/9.jpg", "src/10.jpg", "src/11.jpg", "src/12.jpg",
  "src/13.jpg", "src/14.jpg", "src/15.jpg", "src/16.jpg", "src/17.jpg", "src/18.jpg",
  "src/19.jpg", "src/20.jpg", "src/21.jpg", "src/22.jpg", "src/23.jpg", "src/24.jpg"
  ],m=s.length;while(m){var i=~~(Math.random()*m),t=s[--m];s[m]=s[i];s[i]=t};var c=document.getElementById("split").querySelectorAll(".col img");for(var i=0;i<4;i++){c[i].src=s[i];c[i].alt="Ahyeon Babymonster - photo "+(i+1)}})();
</script>

</body>
</html>
